services:
  # 1. FastAPI Backend Service
  - type: web
    name: vaani-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: VAANI_HOST
        value: 0.0.0.0
      - key: VAANI_CORS_ORIGINS
        value: "*"
      - key: VAANI_MONGODB_URI
        sync: false
      - key: VAANI_MONGODB_DB
        value: vaani_ai
      - key: VAANI_HUGGINGFACE_API_KEY
        sync: false
      - key: VAANI_GNANI_API_KEY
        sync: false
      - key: VAANI_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: VAANI_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: VAANI_GCP_PROJECT_ID
        sync: false
      - key: VAANI_GCS_BUCKET_NAME
        sync: false
      - key: VAANI_GOOGLE_APPLICATION_CREDENTIALS
        sync: false

  # 2. Next.js Frontend Service
  - type: web
    name: vaani-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false