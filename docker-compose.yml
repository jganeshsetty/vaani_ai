version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: vaani-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: vaani
      MONGO_INITDB_ROOT_PASSWORD: vaani
      MONGO_INITDB_DATABASE: vaani_ai
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaani-backend
    ports:
      - "8000:8000"
    environment:
      - VAANI_MONGODB_URI=mongodb://localhost:27017
      - VAANI_MONGODB_DB=vaani_ai
      - VAANI_HOST=0.0.0.0
      - VAANI_PORT=8000
      - VAANI_CORS_ORIGINS=*
    volumes:
      - ./app:/app/app:ro
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data: